server:
  port: 8086

spring:
  application:
    name: devolucion

  datasource:
    url: jdbc:mysql://localhost:3306/db_tiendamusical
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver


  flyway:
    enabled: true
    repair: true
    baseline-on-migrate: true
    check-location: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: laClaveDeLaTiendaDeMusicaEstanLargaLoSuficiente


pedidos-service:
  url: http://localhost:8085/api/pedidos

cliente-service:
  url: http://localhost:8081/api/clientes