server:
  port: 8084

spring:
  application:
    name: productos

  datasource:
    url: jdbc:mysql://localhost:3306/db_tiendamusical
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_servicioTecnico

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

producto-service:
  url: http://localhost:8083/api/productos

cliente-service:
  url: http://localhost:8081/api/clientes

jwt:
  secret: laClaveDeLaTiendaDeMusicaEstanLargaLoSuficiente

