apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tienda-gateway
  namespace: tienda
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tienda-routes
  namespace: tienda
spec:
  parentRefs:
    - name: tienda-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
      backendRefs:
        - name: auth-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/clientes
      backendRefs:
        - name: cliente-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /api/reclamos
      backendRefs:
        - name: reclamo-service
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/productos
      backendRefs:
        - name: producto-service
          port: 8083
    - matches:
        - path:
            type: PathPrefix
            value: /api/servicio-tecnico
      backendRefs:
        - name: servicio-tecnico-service
          port: 8084
    - matches:
        - path:
            type: PathPrefix
            value: /api/pedidos
      backendRefs:
        - name: pedidos-service
          port: 8085
    - matches:
        - path:
            type: PathPrefix
            value: /api/devoluciones
      backendRefs:
        - name: devoluciones-service
          port: 8086