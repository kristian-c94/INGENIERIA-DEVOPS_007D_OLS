name: Integracion Continua (CI Pipeline)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # =======================================================
  # PRUEBAS UNITARIAS, COBERTURA Y ANÁLISIS ESTÁTICO (SNYK + SONAR)
  # =======================================================
  test:
    name: Pruebas Unitarias, Cobertura y Análisis de Seguridad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-Service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicioTecnico

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requiere el historial completo para SonarCloud

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. Ejecutar Pruebas Unitarias y Generar JaCoCo XML/HTML
      - name: Ejecutar Pruebas Unitarias con Maven
        run: |
          cd ${{ matrix.service }}
          mvn clean test -Dspring.profiles.active=test

      # 2. Subir Reportes HTML de JaCoCo como Artefactos
      - name: Subir Reporte HTML de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 5

      # 1. Asegurar la compilación ligera previa para que Snyk no tenga que resolver dependencias desde cero
      - name: Pre-compilar dependencias del microservicio
        run: |
          cd ${{ matrix.service }}
          mvn dependency:resolve -q

      # 2. Configurar Snyk CLI
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # 3. Ejecutar Snyk Test sin fallar por subprocesos de Maven
      - name: Run Snyk test
        run: snyk test --file=${{ matrix.service }}/pom.xml --skip-unresolved=true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        continue-on-error: true

      # 4. Ejecutar Snyk Monitor
      - name: Run Snyk monitor
        run: snyk monitor --file=${{ matrix.service }}/pom.xml --skip-unresolved=true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        continue-on-error: true

  # =======================================================
  # Build Docker & Push a GHCR
  # =======================================================
  docker:
    name: Build and Push Microservices
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: ./auth-Service
          - name: cliente-service
            context: ./cliente
          - name: producto-service
            context: ./productos
          - name: pedidos-service
            context: ./pedidos
          - name: devoluciones-service
            context: ./devolucion
          - name: reclamo-service
            context: ./reclamos
          - name: serviciotecnico-service
            context: ./servicioTecnico

    permissions:
      contents: read
      packages: write

    steps:
      - name: Clonar codigo
        uses: actions/checkout@v4

      - name: Convert Repo Name to Lowercase
        id: repo_name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ steps.repo_name.outputs.REPO }}/${{ matrix.name }}:latest