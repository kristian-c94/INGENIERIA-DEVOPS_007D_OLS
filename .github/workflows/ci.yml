name: Integracion Continua (CI Pipeline)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # =======================================================
  # 1. PRUEBAS UNITARIAS Y GENERACIÓN DE JACOCO
  # =======================================================
  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-Service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicioTecnico

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias con Maven
        run: |
          cd ${{ matrix.service }}
          mvn clean test -Dspring.profiles.active=test

      - name: Subir Reporte HTML de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 5

  # =======================================================
  # 2. ESCANEO DE SEGURIDAD Y VULNERABILIDADES (SNYK)
  # =======================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-Service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicioTecnico
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Snyk Scan usando Acción Oficial
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=${{ matrix.service }}/pom.xml --severity-threshold=high --skip-unresolved=true

  # =======================================================
  # 3. ANÁLISIS DE CALIDAD DE CÓDIGO (SONARCLOUD)
  # =======================================================
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-Service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicioTecnico
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          project