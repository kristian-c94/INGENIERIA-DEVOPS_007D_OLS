name: Integración Continua (CI Pipeline)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Simulación de Compilación
        run: |
          echo "Compilando el microservicio..."
          echo "Ejecutando pruebas unitarias de integración..."
          echo "¡Pipeline ejecutado con éxito!"