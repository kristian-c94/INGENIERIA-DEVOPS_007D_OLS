name: Integracion Continua (CI Pipeline)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # =======================================================
  # 1. PRUEBAS UNITARIAS Y GENERACIÓN DE JACOCO
  # =======================================================
  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicio-tecnico

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias con Maven
        run: |
          cd ${{ matrix.service }}
          mvn clean test -Dspring.profiles.active=test

      - name: Subir Reporte HTML de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 5

  # =======================================================
  # 2. ESCANEO DE SEGURIDAD Y VULNERABILIDADES (SNYK)
  # =======================================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicio-tecnico
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Analizar dependencias con Snyk Maven Action
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=${{ matrix.service }}/pom.xml --severity-threshold=high --skip-unresolved=true

  # =======================================================
  # 3. ANÁLISIS DE CALIDAD DE CÓDIGO (SONARCLOUD)
  # =======================================================
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cliente
          - productos
          - pedidos
          - devolucion
          - reclamos
          - servicio-tecnico
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =======================================================
  # 4. BUILD DOCKER & PUSH A GHCR
  # =======================================================
  docker:
    name: Build and Push Microservices
    needs: [test, snyk, sonarcloud]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: ./auth-service
          - name: cliente-service
            context: ./cliente
          - name: producto-service
            context: ./productos
          - name: pedidos-service
            context: ./pedidos
          - name: devoluciones-service
            context: ./devolucion
          - name: reclamo-service
            context: ./reclamos
          - name: servicio-tecnico-service
            context: ./servicio-tecnico
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clonar codigo
        uses: actions/checkout@v4

      - name: Convert Repo Name to Lowercase
        id: repo_name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.repo_name.outputs.REPO }}/${{ matrix.name }}:latest